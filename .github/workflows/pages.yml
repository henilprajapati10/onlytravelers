# Deploys the site to GitHub Pages on every push to the default branch.
#
# This is the zero-account deploy: a static export of the whole site,
# served at https://henilprajapati10.github.io/onlytravelers/. The first
# run enables Pages on the repository; nothing else needs setting up.
#
# For a domain of your own, set NEXT_PUBLIC_SITE_URL to it, drop
# NEXT_PUBLIC_BASE_PATH, and add the domain under Settings → Pages
# (or move to Vercel — see DEPLOYMENT.md).
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/india-travel-website-cart-guda8o, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Enable Pages on the repository
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - name: Build static export
        run: npx next build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /onlytravelers
          NEXT_PUBLIC_SITE_URL: https://henilprajapati10.github.io/onlytravelers
      - name: Finish the export for a file host
        # Jekyll would skip _next/; and social images need an extension to be
        # served as image/png (the pages already link to the .png names).
        run: |
          touch out/.nojekyll
          find out -type f -name opengraph-image -exec mv {} {}.png \;
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
